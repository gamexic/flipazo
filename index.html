* { box-sizing: border-box; }

.flash.on { opacity: 1; transition-duration: 60ms; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

.press { transition: transform 160ms var(--ease-out), background-color 160ms ease, border-color 160ms ease; }

const EMOJI_IMG = {};
function preloadEmoji() {
  return Promise.all(Object.keys(EMOJI_SVG).map(k => new Promise(res => {
    const im = new Image(); im.onload = () => { EMOJI_IMG[k] = im; res(); }; im.onerror = () => res();
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(EMOJI_SVG[k]);
  })));
}
function drawEmoji(c, ch, cx, cy, size) {

}
function startLevel(n) {
  S.level = n; S.lives = 3; S.mistakes = 0; S.combo = 0; S.levelStartScore = S.score;
  const L = LEVELS[n]; S.phase = 'dealing'; S.lock = true;
  closePanel(); hud.hidden = false; renderHearts(); setCombo();
  $('lvlN').textContent = `Nivel ${n + 1}`; $('lvlP').textContent = `${L.pairs} pares`;
  const wait = dealBoard(L.pairs);
  fitCamera();
  later(wait, () => beginMemorize(L));
}
function beginMemorize(L) {
  S.phase = 'memorize'; S.mem = L.mem; S.memTotal = L.mem; fitCamera();
  $('dockLab').textContent = 'Memoriza las parejas'; $('btnSkip').hidden = false;
  dock.classList.add('show'); S.lastTick = L.mem + 1;
}
function endMemorize(early) {
  if (S.phase !== 'memorize') return;
  S.phase = 'hiding';
  if (early) { const b = Math.round(S.mem) * 10; if (b > 0) { S.score += b; setScore(); } }
  dock.classList.remove('show'); showToast('¡Ahora a recordar!');
  S.cards.forEach((c, i) => setFace(c, false, 120 + i * 40));
  later(120 + S.cards.length * 40 + 650, () => { S.phase = 'play'; S.lock = false; fitCamera(); });
}
$('btnSkip').addEventListener('click', () => { audio(true); endMemorize(true); });
$('btnMenu').addEventListener('click', () => { audio(true); showMenu(); });
$('btnSound').addEventListener('click', e => { S.sound = !S.sound; e.currentTarget.setAttribute('aria-pressed', S.sound); $('icoSound').innerHTML = S.sound ? '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/>'; if (S.sound) { audio(true); sfx.tick(); } });

function onPick(c) {
  if (S.phase !== 'play' || S.lock || !c || c.up || c.matched) return;
  setFace(c, true); c.hov.t = 0;
  if (!S.first) { S.first = c; return; }
  const a = S.first, b = c; S.first = null; S.lock = true;
  later(560, () => {
    if (a.key === b.key) {
      a.matched = b.matched = true; S.combo++;
      const pts = 100 * Math.min(S.combo, 5); S.score += pts; setScore(); setCombo();
      [a, b].forEach(k => { k.glow.t = 1; k.pop.v = 9; k.pop.t = 0; burst(k.fx, k.fz, `hsl(${k.it.hue},90%,60%)`, 22); });
      sfx.match(); if (S.combo >= 2) sfx.streak(S.combo);
      if (S.cards.every(k => k.matched)) { S.phase = 'clear'; later(850, levelClear); } else S.lock = false;
    } else {
      S.lives--; S.mistakes++; S.combo = 0; updateHearts(); setCombo(); flash(); sfx.fail();
      [a, b].forEach((k, i) => { k.err.x = 1.2; k.err.t = 0; k.shk.v = (i ? -1 : 1) * 70; k.shk.t = 0; });
      if (S.lives <= 0) { S.phase = 'over'; later(700, gameOver); }
      else later(520, () => { setFace(a, false); setFace(b, false); later(420, () => { S.lock = false; }); });
    }
  });
}
function levelClear() {
  comboEl.classList.remove('show');
  const lv = S.level, bonus = S.lives * 150 + (lv + 1) * 100; S.score += bonus; setScore();
  if (S.score > S.best) { S.best = S.score; try { localStorage.setItem(S.bestKey, String(S.best)); } catch (e) {} }
  sfx.win(); S.cards.forEach(c => burst(c.fx, c.fz, `hsl(${c.it.hue},90%,60%)`, 4));
  const last = lv >= LEVELS.length - 1, stars = S.lives;
  const st = [0, 1, 2].map(i => STAR(i).replace('STATE', i < stars ? 'on' : 'off')).join('');
  openPanel(`<h2 class="res-title">${last ? '¡FLIPAZO TOTAL!' : '¡Nivel superado!'}</h2>
    <p class="res-sub">${last ? 'Has completado los 8 niveles. Memoria de campeón.' : `Nivel ${lv + 1} completado, ${S.mistakes ? `con ${S.mistakes} ${S.mistakes === 1 ? 'fallo' : 'fallos'}` : 'sin ningún fallo'}.`}</p>
    <div class="stars" aria-label="${stars} de 3 estrellas">${st}</div>
    <dl class="stats"><dt>Bonus por vidas</dt><dd>+${S.lives * 150}</dd><dt>Bonus de nivel</dt><dd>+${(lv + 1) * 100}</dd><div class="tot"><span>Puntos</span><span>${S.score.toLocaleString('es')}</span></div></dl>
    <div class="btnrow">${last ? '<button class="cta" id="btnAgain" data-auto>OTRA PARTIDA</button><button class="cta ghost" id="btnMenu2">Menú</button>' : '<button class="cta" id="btnNext" data-auto>SIGUIENTE NIVEL</button><button class="cta ghost" id="btnMenu2">Menú</button>'}</div>`, true);
  S.phase = 'result';
}
function gameOver() {
  comboEl.classList.remove('show');
  sfx.lose(); S.cards.forEach((c, i) => { if (!c.matched) setFace(c, true, 60 + i * 30); });
  if (S.score > S.best) { S.best = S.score; try { localStorage.setItem(S.bestKey, String(S.best)); } catch (e) {} }
  later(900 + S.cards.length * 30, () => {
    S.phase = 'result';
    openPanel(`<h2 class="res-title bad">¡Sin vidas!</h2>
    <p class="res-sub">Las parejas que faltaban ya están a la vista. Llegaste al nivel ${S.level + 1}.</p>
    <dl class="stats"><dt>Puntos</dt><dd>${S.score.toLocaleString('es')}</dd><dt>Récord</dt><dd>${S.best.toLocaleString('es')}</dd></dl>
    <div class="btnrow"><button class="cta" id="btnRetry" data-auto>REINTENTAR NIVEL</button><button class="cta ghost" id="btnMenu2">Menú</button></div>`, true);
  });
}

/* ---------- Entrada ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev) {
  const r = canvas.getBoundingClientRect(); ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera); const hit = ray.intersectObjects(pickMeshes, false)[0]; return hit ? hit.object.userData.card : null;
}
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 12) return; audio(true); onPick(pick(e));
});
canvas.addEventListener('pointermove', e => {
  camPar.tx = (e.clientX / innerWidth - 0.5) * 2; camPar.ty = (e.clientY / innerHeight - 0.5) * 2;
  if (e.pointerType === 'touch') return;
  const c = S.phase === 'play' && !S.lock ? pick(e) : null; S.hover = c && !c.up && !c.matched ? c : null;
  canvas.style.cursor = S.hover ? 'pointer' : 'default';
});
canvas.addEventListener('pointerleave', () => { S.hover = null; });
addEventListener('resize', () => fitCamera());

/* ---------- Bucle ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dtr = (now - last) / 1000; last = now; const dt = Math.min(dtr, 1 / 30);
  if (document.hidden) return;
  time += dt; tickQueue(dt * 1000);
  if (S.phase === 'memorize') {
    S.mem -= dt; const n = Math.max(0, Math.ceil(S.mem));
    $('dockN').textContent = n; $('dockBar').style.transform = `scaleX(${clamp(S.mem / S.memTotal, 0, 1)})`;
    if (n < S.lastTick && n <= 3 && n > 0) sfx.tick(); S.lastTick = n;
    if (S.mem <= 0) endMemorize(false);
  }
  S.cards.forEach(c => { c.hov.t = (c === S.hover) ? 1 : 0; updateCard(c, dt); });
  camPar.x += (camPar.tx - camPar.x) * Math.min(1, dt * 3); camPar.y += (camPar.ty - camPar.y) * Math.min(1, dt * 3);
  camera.position.set(camBase.x + camPar.x * 0.7, camBase.y + camPar.y * -0.4, camBase.z + camPar.y * 0.5); camera.lookAt(0, 0, 0);
  updateParticles(dt);
  renderer.render(scene, camera);
}

window.__flipazo = { S, camera, pick: c => { const v = new THREE.Vector3(c.g.position.x, 0.05, c.g.position.z).project(camera); return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight }; } };

(document.fonts && document.fonts.load ? Promise.race([Promise.all([document.fonts.load(`40px "Lilita One"`), document.fonts.load(`16px "DM Sans"`)]), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve())
  .catch(() => {}).then(() => Promise.race([preloadEmoji(), new Promise(r => setTimeout(r, 4000))])).catch(() => {}).then(() => { fitCamera(); showMenu(); requestAnimationFrame(frame); });
})();
</script>
